<!-- 
  COMPONENTE: VENTANA MODAL EMERGENTE DE LOGIN PREVYSEG (SUPABASE)
  Abre la tarjeta oficial de acceso conectada a la base de datos Supabase.
-->

<div class="login-modal-overlay" id="loginModal">
  <div class="login-modal-content">
    <button type="button" class="modal-close-btn" data-close-login-modal aria-label="Cerrar">&times;</button>
    
    <div class="login-card" style="box-shadow: none; margin: 0; padding-top: 24px; border: none;">
      <!-- Cabecera con Logo Oficial PrevySeg -->
      <div class="login-header">
        <img 
          src="components/prevyseg_logo.png" 
          alt="PrevySeg Organismos Técnicos de Capacitación" 
          class="login-logo-img"
          onerror="this.onerror=null; this.src='../prevyseg_logo.png';"
        >
      </div>

      <!-- Alerta de acceso inválido -->
      <div class="login-alert" id="modalLoginAlert">
        Acceso inválido. Por favor, inténtelo otra vez.
      </div>

      <form class="login-form" id="modalLoginForm" method="POST" autocomplete="on">
        <!-- Campo Nombre de usuario -->
        <div class="form-group">
          <div class="input-wrapper">
            <input 
              type="text" 
              id="modal_username" 
              name="username" 
              placeholder="Nombre de usuario" 
              autocomplete="username" 
              required
            >
          </div>
        </div>

        <!-- Campo Contraseña -->
        <div class="form-group">
          <div class="input-wrapper">
            <input 
              type="password" 
              id="modal_password" 
              name="password" 
              placeholder="Contraseña" 
              autocomplete="current-password" 
              required
            >
          </div>
        </div>

        <!-- Botón Acceder -->
        <button type="submit" class="btn-submit">
          Acceder
        </button>

        <!-- ¿Olvidó su contraseña? -->
        <div class="moodle-forgot-container">
          <a href="javascript:void(0)" class="forgot-password-link">
            ¿Olvidó su contraseña?
          </a>
        </div>

        <!-- Entrar como persona invitada -->
        <button type="button" class="btn-guest">
          Entrar como persona invitada
        </button>
      </form>

      <!-- Pie de tarjeta -->
      <div class="login-card-footer">
        <div class="lang-selector">
          Español - Internacional (es) &#9662;
        </div>
        <div>
          <a href="javascript:void(0)">
            &#9432; Aviso de Cookies
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
